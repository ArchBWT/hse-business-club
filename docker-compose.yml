version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: hse_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hse_user
      POSTGRES_PASSWORD: hse_password
      POSTGRES_DB: hse_club
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hse_user -d hse_club"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hse_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://hse_user:hse_password@db:5432/hse_club
      SECRET_KEY: "hse-club-secret-key-change-me-in-production-must-be-at-least-32-chars"
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hse_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
